<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buy & Sell Cars</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #2c3e50;
            color: white;
            padding: 20px;
            text-align: center;
        }
        .car-listing {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            margin: 20px;
        }
        .car {
            background: white;
            border: 1px solid #ccc;
            border-radius: 8px;
            width: 300px;
            margin: 10px;
            padding: 15px;
        }
        .car img {
            width: 100%;
            border-radius: 4px;
        }
        form {
            background: white;
            padding: 20px;
            margin: 20px auto;
            width: 80%;
            max-width: 600px;
            border-radius: 8px;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            margin-bottom: 20px;
        }
        button {
            background-color: #27ae60;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #219150;
        }
    </style>
</head>
<body>

<header>
    <h1>Welcome to CarTrader</h1>
    <p>Buy and Sell Cars Easily</p>
</header>

<section class="car-listing">
    <div class="car">
        <img src="https://images.autox.com/uploads/2024/04/Skoda-Superb-Magic-Black.webp" alt="Car Image">
        <h3>2022 Toyota Corolla</h3>
        <p>Price: $18,000</p>
        <p>Low mileage, excellent condition. Contact now!</p>
    </div>
    <div class="car">
        <img src="https://images.autox.com/uploads/2024/12/Mahindra-Be-6-Firestorm-Orange.webp" alt="Car Image">
        <h3>2020 Ford Mustang</h3>
        <p>Price: $25,000</p>
        <p>Sporty and fun to drive. One owner only.</p>
    </div>
</section>

<section>
    <form>
        <h2>Sell Your Car</h2>
        <input type="text" placeholder="Your Name" required>
        <input type="email" placeholder="Your Email" required>
        <input type="text" placeholder="Car Make and Model" required>
        <input type="text" placeholder="Year & Price" required>
        <textarea placeholder="Additional Details" rows="5"></textarea>
        <button type="submit">Submit</button>
    </form>
</section>

</body>
</html>
